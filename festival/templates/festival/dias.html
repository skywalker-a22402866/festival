{% extends 'festival/layout.html' %}

{% block content %}
    
{% for dia in dias %}
<h3>{{dia}}</h3>

    {% for concerto in palco.concertos.all %}
        <article class="card">
            <a href="{% url 'dias' dia.id %}">
            {{ concerto.banda.nome }} - {{ concerto.dia }}
            </a>
        </article>
    {% endfor %}

{% endfor %}

{% endblock %}
